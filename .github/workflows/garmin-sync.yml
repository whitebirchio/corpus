# Garmin Connect → Corpus sync (specs/01-initial-platform/SPEC.md §8.4).
#
# Runs the unofficial-API pull in real Python (the Workers sandbox can't —
# garminconnect needs raw sockets). Two cadences:
#   - every 4h: trailing 2-day window, a cheap same-day refresh that also
#     covers the previous run if GitHub dropped it.
#   - nightly (09:47 UTC): trailing 7-day window, the self-healing catch-all
#     that covers missed runs or data Garmin backfilled late.
# Both are idempotent re-runs (see packages/core/src/import/garmin.ts), so
# overlapping windows are safe. Failure emails come from GitHub by default.
#
# GitHub's cron is best-effort: runs are delayed (we've seen 37 min to 3 h) or
# silently dropped under load, worst at the top of the hour — and a run that
# never starts sends no failure email (2026-10-16 → 23 had none at all). So the
# crons sit at odd minutes, the windows overlap, and staleness is surfaced in
# Corpus itself: get_daily_summary.garminSync flags >12 h without a successful
# ingest, so a stalled sync is noticed at the next check-in.
# A manual run with `weight_since` set instead backfills every Garmin weigh-in
# from that date (specs/06-garmin-weigh-ins; one-time history import).
#
# Secrets: CORPUS_INGEST_SECRET (mirrors the worker's GARMIN_INGEST_SECRET).
# Garmin credentials are NOT stored here — tokens are bootstrapped locally
# (see docs/SETUP.md §7) and live in the worker's KV token store.
name: garmin-sync

on:
  schedule:
    # Off the top of the hour on purpose (see above). If you change the nightly
    # cron, change the matching string in DAYS below too.
    - cron: "23 */4 * * *" # same-day refresh, trailing 2 days
    - cron: "47 9 * * *" # nightly self-heal, trailing 7 days — 05:47/04:47 America/New_York depending on DST
  workflow_dispatch:
    inputs:
      days:
        description: "Trailing days to pull"
        required: false
        default: "7"
      weight_since:
        description: "One-time weigh-in backfill from YYYY-MM-DD (leave empty for a normal pull)"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    # A normal pull takes seconds and the full backfill ~3 min; never let a
    # hung Garmin or worker call hold a runner for GitHub's 6 h default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Pinned to 7.0.0: 7.1.0 is days old (2026-10-22); bump after it settles.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/garmin-sync/requirements.txt
      - run: pip install -r apps/garmin-sync/requirements.txt
      # Inputs go through env, not inline ${{ }} in the script (no shell injection).
      - run: |
          if [ -n "$WEIGHT_SINCE" ]; then
            python apps/garmin-sync/sync.py pull --weight-since "$WEIGHT_SINCE"
          else
            python apps/garmin-sync/sync.py pull --days "$DAYS"
          fi
        env:
          DAYS: ${{ inputs.days || (github.event.schedule == '47 9 * * *' && '7' || '2') }}
          WEIGHT_SINCE: ${{ inputs.weight_since }}
          CORPUS_BASE_URL: https://corpus-mcp.whitebirch.workers.dev
          CORPUS_INGEST_SECRET: ${{ secrets.CORPUS_INGEST_SECRET }}
          CORPUS_USER_EMAIL: scott.schmalz@gmail.com
          CORPUS_TIMEZONE: America/New_York
